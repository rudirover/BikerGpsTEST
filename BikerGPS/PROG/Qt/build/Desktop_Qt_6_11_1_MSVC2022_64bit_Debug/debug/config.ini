[General]
LogFileName=app.log
CoordinatePrecision=6

[Bluetooth]
# Timeout in milliseconds for BLE discovery scanning
DiscoveryTimeoutMs=7000
# Target BLE peripheral device name
DeviceName=BikerNetworkTool
# Target GATT Service UUID
ServiceUuid=0000180f-0000-1000-8000-00805f9b34fb
# Target GATT Characteristic UUID
CharacteristicUuid=00002a19-0000-1000-8000-00805f9b34fb
# Enable GATT write with response
WriteWithResponse=true
DefaultFileName=default.json
WriteMode=Queued

[Overpass]
# API endpoint URL for downloading bicycle network routes
Endpoint1=https://overpass-api.de/api/interpreter
Endpoint2=https://overpass.kumi.systems/api/interpreter
Endpoint3=https://overpass.private.coffee/api/interpreter
Endpoint4=https://maps.mail.ru/osm/tools/overpass/api/interpreter
Endpoint5=
Endpoint6=
Endpoint7=
Endpoint8=
Endpoint9=
Endpoint10=
# Server-side execution timeout in seconds
QueryTimeoutSec=120
# HTTP User-Agent identification string
UserAgent=BikeNetworkTool/1.0 (Contact: rudih@project.local)
# Minimum segment length threshold in meters
MinSegmentDistanceMeters=50.0
# Mean Earth radius in meters
EarthRadiusMeters=6371000.0
# Overpass query relation filter
QueryFilter=relation["route"="bicycle"]["network"="rcn"]
# Distance measurement unit string
DistanceUnit=km
#TimeOut
Timeout=30

[Route]
# Minimum turn angle in degrees (0-180) to trigger an auto-generated waypoint.
TurnAngleThreshold=45.0
# Minimum required distance in meters between consecutive auto-generated waypoints.
MinDistBetweenWpts=15.0
# Lookback and lookahead distance in meters used to calculate heading vectors around curves.
SampleWindowMeters=5.0
# Automatically write sent_route_log.json and sent_route_log.gpx during GPX import (true/false).
AutoSaveLogs=true
# Number of decimal places for latitude/longitude coordinate output.
CoordinatePrecision=6
# Mean Earth radius in meters used for Haversine distance calculations.
EarthRadiusMeters=6371000.0
# Filename for the exported JSON route log saved beside the application executable.
JsonLogFilename=sent_route_log.json
# Filename for the exported GPX route log saved beside the application executable.
GpxLogFilename=sent_route_log.gpx
# Filename for the exported MAP route log saved beside the application executable.
MapLogFilename=sent_route_log.bma2
# Metadata creator string written inside the GPX XML root element.
GpxCreator=RouteModel
# Starting integer used to name sequentially auto-generated waypoints.
StartWaypointIndex=1
# GPX schema version
GpxVersion=1.1
# GPX XML namespace
GpxXmlns=http://www.topografix.com/GPX/1/1
# Distance measurement unit string
DistanceUnit=km
# Fallback text displayed when segment distance is unknown
MissingDistanceFallback=?? km
ImportPaddingDegrees=0.005

[Web]
# URL loaded in integrated web map browser
MapViewerUrl=https://www.fietsknooppunt.be/nl-be/
BunchiesUrl=https://www.bunchies.cc
# Title for the web browser window
WindowTitle=Fietsknooppunt Browser
WindowWidth=944
WindowHeight=880
SnapOffsetPx=8

[UI]
WindowWidth=256
WindowHeight=880
ProgressResetDelayMs=5000
StatusMessageDelayMs=3000
DistanceSeparatorFormat=│  ▼  %1  ▼  │
ListItemWidth=84
ListItemHeight=84
DistanceItemHeight=35
BadgeSize=64
BadgeBgColor=#23232a
BadgeBorderColor=#10b981
BadgeTextColor=#ffffff
BadgeBorderWidth=4
BadgeFontSize=24
DistanceTextColor=#10b981
ContainerMarginLeft=10
ContainerMarginTop=4
ContainerMarginRight=10
ContainerMarginBottom=4
GpxDownloadFilter=GPX Track (*.gpx);;All Files (*.*)
GpxOpenFilter=GPX Files (*.gpx)
